# Source for LayaBench.xcodeproj. Regenerate with `xcodegen` in this directory after editing.
name: LayaBench
options:
  bundleIdPrefix: io.github.laya
  deploymentTarget:
    iOS: "16.0"
packages:
  onnxruntime:
    # ORT 1.24.2 (main at 2026-02-25). The newest tag, v1.19.2, predates the
    # 8-bit MatMulNBits kernel the w8e8 variant needs.
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    revision: b7fb7f7dea8a2469e6335d95a61b8f36d0dc83b2
targets:
  LayaBench:
    type: application
    platform: iOS
    sources:
      - path: LayaBench
      - path: Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.laya.LayaBench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: LayaBench
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
